services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --mode dev-container
      - --smp 1
    ports:
      - "9092:9092"
      - "18081:18081"

  gateway:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - redpanda

  dashboard:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./dashboard:/app
    ports:
      - "3000:3000"
    command: npm run dev
